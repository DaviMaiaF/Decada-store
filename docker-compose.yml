services:
  db:
    image: postgres:16-alpine
    container_name: decada-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decada}
      POSTGRES_DB: ${POSTGRES_DB:-decada}
    ports:
      # Se a 5432 já estiver ocupada na sua máquina, defina POSTGRES_PORT no .env.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - decada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decada} -d ${POSTGRES_DB:-decada}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  decada_pgdata:

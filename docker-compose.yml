# Um comando sobe tudo (banco, API e app):  docker compose up --build
# Para o celular alcançar a API e o Metro, defina HOST_IP no .env com o IP
# da sua máquina na rede local (ex.: HOST_IP=192.168.0.10).
services:
  db:
    image: postgres:16-alpine
    container_name: decada-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decada}
      POSTGRES_DB: ${POSTGRES_DB:-decada}
    ports:
      # Se a 5432 já estiver ocupada na sua máquina, defina POSTGRES_PORT no .env.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - decada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decada} -d ${POSTGRES_DB:-decada}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: decada-api
    restart: unless-stopped
    # Um init de verdade no PID 1 repassa o sinal de parada e recolhe os
    # processos do --reload; sem ele, parar a API esperava 10 s.
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro da rede do compose o banco é o serviço "db", na porta interna 5432.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-decada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decada}
      POSTGRES_DB: ${POSTGRES_DB:-decada}
      SECRET_KEY: ${SECRET_KEY:-chave-de-desenvolvimento-nao-use-em-producao}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app

  mobile:
    build: ./mobile
    container_name: decada-mobile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # IP da máquina na rede local: vai no QR code do Expo, e o celular deduz a
      # API dele (config.ts). A web não depende dele: usa o host da página.
      # RESET_SESSION=1 no .env: o app abre sempre no login (só limpa o token do aparelho).
      EXPO_PUBLIC_RESET_SESSION: ${RESET_SESSION:-0}
      EXPO_NO_TELEMETRY: "1"
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-localhost}
      # O mobile/.env de quem roda o app fora do Docker entra pelo volume; aqui
      # ele não vale, senão um `localhost` escrito ali desviava o celular.
      EXPO_NO_DOTENV: "1"
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  decada_pgdata:
  mobile_node_modules:

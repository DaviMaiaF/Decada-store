<!DOCTYPE html>
<!--
  Página da versão web do app. Substitui o template padrão do Expo, que declara
  lang="en": o Chrome acreditava, oferecia "traduzir para português" e estragava
  o texto ("Lembrar de mim" virava "rã de mim"). O app é todo em pt-BR, então a
  página diz isso e pede ao navegador para não traduzir.
-->
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="google" content="notranslate" />
    <title>%WEB_TITLE%</title>
    <style>
      /* Igual ao template do Expo: a raiz ocupa a tela inteira, sem rolagem do body. */
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Ative o JavaScript para usar o app.</noscript>
    <div id="root"></div>
  </body>
</html>

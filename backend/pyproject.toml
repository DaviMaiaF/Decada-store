[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutricart-backend"
version = "0.1.0"
description = "API do NutriCart — traduz plano alimentar em lista de compras com custo estimado"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Banco: ainda não usados em código (entram na etapa 1), já declarados
    # para não mexer neste arquivo de novo.
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Migrações são geradas pelo Alembic a partir de um template fixo; não vale
# reformatá-las a cada revisão nova.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# Sem isto o ruff confunde a biblioteca `alembic` com a pasta alembic/ do projeto.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# Chamar Depends() no valor padrão do argumento é o idioma do FastAPI.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

# Roda as duas suítes a cada push na main e em todo pull request.
#
# Os dois trabalhos são independentes de propósito: quebrar o app não esconde o
# resultado do backend, e quem abriu o PR vê num relance qual dos dois caiu.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest

    # Os testes usam Postgres de verdade, não SQLite: o projeto depende de tipos
    # e comportamentos do Postgres (UUID, ENUM nomeado, `now()` por transação).
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: decada
          POSTGRES_PASSWORD: decada
          POSTGRES_DB: decada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decada -d decada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # 3.10 é o mínimo do projeto, e é o que a máquina de desenvolvimento tem.
      # Rodar no mínimo é o que pega uso acidental de recurso de 3.11+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instala as dependências
        working-directory: backend
        run: pip install -e ".[dev]"

      # Sem isto a suíte passaria de mentira: o conftest chama `pytest.skip`
      # quando o Postgres não responde, então banco fora do ar viraria CI verde
      # com zero teste executado.
      - name: Confere que o Postgres responde
        working-directory: backend
        env:
          PGPASSWORD: decada
        run: python -c "import psycopg; psycopg.connect('postgresql://decada:decada@localhost:5432/decada').close(); print('Postgres no ar')"

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Testes
        working-directory: backend
        run: pytest

  mobile:
    name: app (jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # LTS. O Expo SDK 57 pede Node 20 ou mais novo.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instala as dependências
        working-directory: mobile
        run: npm ci

      - name: Tipos
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Testes
        working-directory: mobile
        run: npx jest --ci
